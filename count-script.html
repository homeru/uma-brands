<script>(function(){fetch("https://homeru.github.io/uma-brands/brands.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){var n=d&&d.number;if(!n)return;var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),t;while(t=w.nextNode()){var v=t.nodeValue,o=v;v=v.replace(/\b\d{2,3}\+(?=\s+(trade partners|brands))/gi,n+"+");v=v.replace(/more than \d{2,3} brands/gi,"more than "+n+" brands");if(v!==o)t.nodeValue=v}}).catch(function(){})})();</script>
